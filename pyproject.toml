[project]
name = "transcribator3000"
version = "0.2.0"
description = "Multi-user LLM vault: transcribe, postprocess, task classify, daily manager"
authors = [{ name = "Artur Krutoy", email = "arturkrutoj134@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "openai>=1.40.0",
    "python-telegram-bot>=21.0",
    "dropbox>=12.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "cryptography>=43.0.0",
    "httpx>=0.28.0",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.154.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "tzdata>=2024.1",
]

[project.scripts]
vault-api = "app.api.main:run"
vault-worker = "app.workers.main:run"
vault-bot = "app.integrations.telegram.bot:run"

[tool.poetry]
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
