[project]
name = "transcribator3000"
version = "0.1.0"
description = "Telegram bot that transcribes voice messages via OpenAI Whisper and saves notes to Dropbox"
authors = [{ name = "Artur Krutoy", email = "arturkrutoj134@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "openai>=1.40.0",
    "python-telegram-bot>=21.0",
    "dropbox>=12.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
